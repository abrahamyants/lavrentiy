name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run core tests
        run: python test_core.py -v

      - name: Run integration tests
        run: python test_integration.py -v

      - name: Run clinical feature tests
        run: python test_clinical.py -v

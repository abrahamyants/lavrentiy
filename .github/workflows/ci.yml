name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install numpy scipy openai -q

      - name: Run core tests
        run: python test_core.py -v

      - name: Run integration tests
        run: python test_integration.py -v

      - name: Run clinical feature tests
        run: python test_clinical.py -v

      - name: Run pending coverage tests
        run: python test_pending.py -v

      - name: Run pipeline integration tests
        run: python test_pipeline.py -v

      - name: Run endpoint tests
        run: python test_endpoints.py -v

      - name: Run thread safety tests
        run: python test_threads.py -v

      - name: Run fuzz tests
        run: python test_fuzz.py -v

      - name: Run performance regression tests
        run: python test_perf.py -v

      - name: Run Whisper voting tests
        run: python test_whisper_voting.py -v

      - name: Run clipboard predictor tests
        run: python test_clipboard.py -v

      - name: Run paralinguistic detection tests
        run: python test_paralinguistic.py -v

      - name: Run prosodic bridging tests
        run: python test_prosodic.py -v

      - name: Run preview tests
        run: python test_preview.py -v

      - name: Run profile and database tests
        run: python test_profile_db.py -v

      - name: Run audio preprocessing tests
        run: python test_audio_preprocess.py -v

      - name: Run WiM API tests
        run: python test_wim_api.py -v

      - name: Run language parity tests
        run: python test_language_parity.py

      - name: Run WiM authenticated audio contract tests
        run: python test_wim_audio_backend.py

      - name: Run WiM billing verification contract tests
        run: python test_wim_billing_backend.py

      - name: Run WiM monthly quota contract tests
        run: python test_wim_quota_backend.py

      - name: Run WiM billing notification contract tests
        run: python test_wim_billing_events.py

      - name: Run WiM cloud-account deletion contract tests
        run: python test_wim_user_data_backend.py

      - name: Run WiM Play reviewer-access contract tests
        run: python test_wim_reviewer_access.py

      - name: Run speech rate tests
        run: python test_speech_rate.py -v

      - name: Run desktop launcher tests
        run: python test_launcher.py

      # The pipeline sweep's parity stage reads the Kotlin rules straight out of
      # wim-android and fails when the two implementations disagree. Without the
      # checkout it has nothing to compare against and fails loudly rather than
      # passing on an empty check, so the repo is fetched here.
      - name: Check out wim-android for cross-implementation parity
        uses: actions/checkout@v4
        with:
          repository: abrahamyants/wim-android
          token: ${{ secrets.WIM_REPO_TOKEN }}
          path: wim-android-parity

      - name: Run full-matrix pipeline sweep
        env:
          WIM_ANDROID_DIR: ${{ github.workspace }}/wim-android-parity
        run: python test_pipeline_sweep.py

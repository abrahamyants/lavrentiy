<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Lavrentiy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:#1a1a1e;font-family:'Segoe UI',system-ui,sans-serif;color:#d4d4d8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
h1{font-size:18px;letter-spacing:3px;color:#d4a574;margin-bottom:6px;font-weight:400}
.sub{font-size:12px;color:#888;letter-spacing:1px;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(3,68px);gap:5px}
.cell{width:68px;height:68px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
  border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:30px;font-weight:700;font-family:monospace;transition:background .15s,transform .1s}
.cell:hover{background:rgba(255,255,255,0.06);transform:scale(1.05)}
.x{color:#ee5a24}.o{color:#b55050}
.status{font-size:11px;color:#888;letter-spacing:1px;margin-top:14px;font-family:monospace}
.reset{font-size:9px;color:#d4a574;cursor:pointer;margin-top:8px;letter-spacing:2px;text-transform:uppercase}
.reset:hover{color:#ee5a24}
.ready{color:#4CAF50;font-size:14px;margin-top:20px;letter-spacing:2px;display:none}
.close{position:absolute;top:14px;right:18px;font-size:22px;color:#666;cursor:pointer;
  padding:4px 10px;border-radius:4px;display:none;font-family:monospace}
.close:hover{color:#d4d4d8;background:rgba(255,255,255,0.05)}
</style></head><body>
<div class="close" id="closeBtn" onclick="location.href='http://127.0.0.1:7878'">&times;</div>
<h1>LAVRENTIY</h1>
<div class="sub">Play Tic-Tac-Toe against young Garry Kasparov's bot</div>
<div class="grid" id="grid"></div>
<div class="status" id="status">Your move (X)</div>
<div class="reset" onclick="reset()">New game</div>
<div class="ready" id="ready">Engine ready!</div>

<script>
// Tic-tac-toe
const G=document.getElementById('grid');
let B=[0,0,0,0,0,0,0,0,0],T=1,O=false;
const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function render(){
  G.innerHTML='';
  B.forEach((v,i)=>{
    const c=document.createElement('div');
    c.className='cell'+(v===1?' x':'')+(v===-1?' o':'');
    c.textContent=v===1?'X':v===-1?'O':'';
    c.onclick=()=>move(i);
    G.appendChild(c);
  });
}
function check(){
  for(const w of W){const s=B[w[0]]+B[w[1]]+B[w[2]];if(s===3)return 1;if(s===-3)return-1;}
  return B.every(v=>v!==0)?0:null;
}
function ai(){
  for(const v of[-1,1]){for(const w of W){const vals=w.map(i=>B[i]);
    if(vals.filter(x=>x===v).length===2&&vals.includes(0)){B[w[vals.indexOf(0)]]=-1;return;}}}
  if(B[4]===0){B[4]=-1;return;}
  const c=[0,2,6,8].filter(i=>B[i]===0);
  if(c.length){B[c[Math.random()*c.length|0]]=-1;return;}
  const e=[1,3,5,7].filter(i=>B[i]===0);
  if(e.length){B[e[Math.random()*e.length|0]]=-1;}
}
function move(i){
  if(O||B[i]||T!==1)return;
  B[i]=1;T=-1;render();
  let r=check();
  if(r!==null){O=true;document.getElementById('status').textContent=r===1?'You win!':'Draw';return;}
  setTimeout(()=>{ai();render();T=1;
    let r2=check();
    if(r2!==null){O=true;document.getElementById('status').textContent=r2===-1?'Kasparov wins':'Draw';}
    else document.getElementById('status').textContent='Your move (X)';
  },300);
}
function reset(){B=[0,0,0,0,0,0,0,0,0];T=1;O=false;render();
  document.getElementById('status').textContent='Your move (X)';}
render();

// Poll engine — redirect when ready
let engineReady=false;
function poll(){
  fetch('http://127.0.0.1:7878/api/state',{signal:AbortSignal.timeout(2000)})
    .then(r=>{if(r.ok){
      engineReady=true;
      document.getElementById('ready').style.display='block';
      document.getElementById('closeBtn').style.display='block';
      document.getElementById('ready').textContent='Engine ready!';
      // If no game in progress, auto-redirect after 1 second
      if(!B.some(v=>v!==0)){setTimeout(()=>location.href='http://127.0.0.1:7878',1000);}
    }})
    .catch(()=>{});
  if(!engineReady)setTimeout(poll,1500);
}
setTimeout(poll,2000);
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лаврентий — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a1a'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='serif' font-weight='900' font-size='42' fill='%23d4a574'%3EЛ%3C/text%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a1e;
    color: #d4d4d8;
    font-family: 'Outfit', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    text-align: center;
    max-width: 360px;
    width: 90%;
  }
  /* ── Brand plate — matches dashboard sidebar ── */
  .brand-plate {
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 14px 20px 10px;
    text-align: center;
    position: relative;
    margin-bottom: 32px;
  }
  .brand-plate::before {
    content: '';
    position: absolute;
    top: 5px; left: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #ffe0a0, #c4956a 50%, #8a7060);
    box-shadow: inset 0 -1px 1px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
  }
  .brand-plate::after {
    content: '';
    position: absolute;
    top: 5px; right: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #ffe0a0, #c4956a 50%, #8a7060);
    box-shadow: inset 0 -1px 1px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
  }
  .screw-bl, .screw-br {
    position: absolute;
    bottom: 5px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #ffe0a0, #c4956a 50%, #8a7060);
    box-shadow: inset 0 -1px 1px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.5);
  }
  .screw-bl { left: 6px; }
  .screw-br { right: 6px; }
  .brand-cyrillic {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    background: linear-gradient(180deg, #d4a574 0%, #c4956a 40%, #b8855a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  .brand-english {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.45);
    text-transform: uppercase;
    margin-top: 3px;
  }
  .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: #6a6a72;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  #google-btn { display: flex; justify-content: center; margin-bottom: 24px; }
  #status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    min-height: 20px;
  }
  .ok { color: #16a34a; }
  .error { color: #b91c1c; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-plate">
      <div class="screw-bl"></div>
      <div class="screw-br"></div>
      <div class="brand-cyrillic">Лаврентий</div>
      <div class="brand-english">LAVRENTIY</div>
    </div>
    <div class="sub">Sign in to enable cloud reconstruction</div>
    <div id="google-btn"></div>
    <div id="status"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script>
    const API = 'http://localhost:7878';
    const GIS_CLIENT_ID = '787543109204-vnln7rus2o37s4oaptepg66i3qcb3ujb.apps.googleusercontent.com';

    firebase.initializeApp({
      apiKey:        "AIzaSyCwHM69yHHWsRRbt1c4bpIjIIV4BxDiLnY",
      authDomain:    "bakers-agent.firebaseapp.com",
      projectId:     "bakers-agent",
      storageBucket: "bakers-agent.firebasestorage.app",
      appId:         "1:787543109204:web:288e7cf9a2880b682f07c1"
    });
    const auth = firebase.auth();

    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = cls || '';
    }

    async function handleGoogleCredential(response) {
      setStatus('Signing in...');
      try {
        const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
        const result = await auth.signInWithCredential(credential);
        const token = await result.user.getIdToken();
        await fetch(API + '/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'sign_in',
            id_token: token,
            email: result.user.email,
            displayName: result.user.displayName || '',
            uid: result.user.uid
          })
        });
        setStatus('Signed in as ' + result.user.email + '. You can close this tab.', 'ok');
      } catch (e) {
        setStatus(e.message || 'Sign-in failed.', 'error');
      }
    }

    google.accounts.id.initialize({
      client_id: GIS_CLIENT_ID,
      callback: handleGoogleCredential
    });
    google.accounts.id.renderButton(
      document.getElementById('google-btn'),
      { theme: 'outline', size: 'large', text: 'signin_with', width: 280 }
    );
  </script>
</body>
</html>
